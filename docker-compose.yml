services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file:
      - path: .env
        required: false
    environment:
      ALLOWED_ORIGINS: http://localhost:8080
      # Override the repo-relative paths from .env: /app is root-owned, /data is the volume.
      EXPENSES_DB_PATH: /data/expenses.db
      MODEL_PATH: /data/categoriser.joblib
    ports:
      - "8000:8000"
    volumes:
      - expense-data:/data
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_API_BASE: http://localhost:8000
    ports:
      - "8080:80"
    depends_on:
      - api
volumes:
  expense-data:
