services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file: .env
    environment:
      ALLOWED_ORIGINS: http://localhost:8080
    ports:
      - "8000:8000"
    volumes:
      - expense-data:/data
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_API_BASE: http://localhost:8000
    ports:
      - "8080:80"
    depends_on:
      - api
volumes:
  expense-data:
